services:
  redis:
    image: redis:latest
  db:
    image: jhnnsrs/daten:next
    restart: always
    environment:
      POSTGRES_MULTIPLE_DATABASES: rekuest
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  rekuest:
    depends_on:
    - redis
    - db
    - rustfs
    image: jhnnsrs/rekuest:${REKUEST_SERVICE_TAG:-next}
    command: bash run-debug.sh
    stop_grace_period: 1s
    ports:
    - 5690:80
    volumes:
    - ./configs/rekuest.yaml:/workspace/config.yaml
  rustfs:
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_SECRET_KEY: e8821a29d189789e39c9922a3bfcfb4a
      RUSTFS_ACCESS_KEY: crappygreysetter
    image: rustfs/rustfs:latest
    ports:
    - 5691:9000
  initc:
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_HOST: http://rustfs:9000
      RUSTFS_SECRET_KEY: e8821a29d189789e39c9922a3bfcfb4a
      RUSTFS_ACCESS_KEY: crappygreysetter
    image: jhnnsrs/init:next
    volumes:
    - ./configs/rustfs.yaml:/workspace/config.yaml


