fragment ActionArgumentLeaf on ActionArgument {
  key
  valueLiteral
  valuePath
  utilCall {
    operation
  }
}

fragment ActionArgumentNested on ActionArgument {
  key
  valueLiteral
  valuePath
  utilCall {
    operation
    arguments {
      ...ActionArgumentLeaf
    }
  }
  valueList {
    ...ActionArgumentLeaf
  }
  valueDict {
    ...ActionArgumentLeaf
  }
}

fragment ActionArgument on ActionArgument {
  key
  valueLiteral
  valuePath
  utilCall {
    operation
    arguments {
      ...ActionArgumentNested
    }
  }
  valueList {
    ...ActionArgumentNested
  }
  valueDict {
    ...ActionArgumentNested
  }
}

fragment UtilCall on UtilCall {
  operation
  arguments {
    ...ActionArgument
  }
}

fragment ArgChildPortNested on ArgPort {
  key
  kind
  children {
    key
    identifier
    nullable
    kind
    referenceUnit
    proposedUnits
    dimension
  }
  choices {
    value
    label
    description
  }
  identifier
  nullable
  default
  referenceUnit
  proposedUnits
  dimension
}

fragment ArgChildPort on ArgPort {
  key
  kind
  identifier
  children {
    ...ArgChildPortNested
  }
  choices {
    value
    label
    description
  }
  nullable
  default
  referenceUnit
  proposedUnits
  dimension
}


fragment ReturnChildPortNested on ReturnPort {
  key
  kind
  children {
    key
    identifier
    nullable
    kind
    referenceUnit
    proposedUnits
    dimension
  }
  choices {
    value
    label
    description
  }
  identifier
  nullable
  referenceUnit
  proposedUnits
  dimension
}

fragment ReturnChildPort on ReturnPort {
  key
  kind
  identifier
  children {
    ...ReturnChildPortNested
  }
  choices {
    value
    label
    description
  }
  nullable
  referenceUnit
  proposedUnits
  dimension
}

fragment CustomEffect on CustomEffect {
  __typename
  kind
}

fragment MessageEffect on MessageEffect {
  __typename
  kind
  message
}

fragment PortEffect on Effect {
  __typename
  kind
  dependencies
  call {
    ...UtilCall
  }
  callJson
  source
  ...CustomEffect
  ...MessageEffect
}

fragment StringAssignWidget on StringAssignWidget {
  __typename
  kind
  placeholder
  asParagraph
}

fragment SliderAssignWidget on SliderAssignWidget {
  __typename
  kind
  min
  max
  step
}

fragment SearchAssignWidget on SearchAssignWidget {
  __typename
  kind
  query
  ward
  dependencies
}

fragment ComponentProp on ComponentProp {
  key
  staticValue
  dynamicValue {
    literal
    path
  }
  declaresValue
  utilCall {
    ...UtilCall
  }
}

fragment CustomAssignWidget on CustomAssignWidget {
  __typename
  kind
  component
  props {
    ...ComponentProp
  }
  dependencies
}

fragment ChoiceAssignWidget on ChoiceAssignWidget {
  __typename
  kind
  placeholder
}

fragment PortAssignWidget on AssignWidget {
  __typename
  kind
  ...StringAssignWidget
  ...SearchAssignWidget
  ...SliderAssignWidget
  ...ChoiceAssignWidget
  ...CustomAssignWidget
}

fragment CustomReturnWidget on CustomReturnWidget {
  __typename
  kind
  component
  props {
    ...ComponentProp
  }
}

fragment ChoiceReturnWidget on ChoiceReturnWidget {
  __typename
  kind
}

fragment ReturnWidget on ReturnWidget {
  __typename
  kind
  ...CustomReturnWidget
  ...ChoiceReturnWidget
}

fragment ArgPort on ArgPort {
  __typename
  key
  label
  nullable
  description
  default
  kind
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    ...ArgChildPort
  }
  widget {
    ...PortAssignWidget
  }
  choices {
    value
    label
    description
  }
  validators {
    call {
      ...UtilCall
    }
    callJson
    source
    errorMessage
    dependencies
    label
  }
  effects {
    ...PortEffect
  }
}


fragment ReturnPort on ReturnPort {
  __typename
  key
  label
  nullable
  description
  kind
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    ...ReturnChildPort
  }
  widget {
    ...ReturnWidget
  }
  choices {
    value
    label
    description
  }
  effects {
    ...PortEffect
  }
}